<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Mobile Controller for Game Creator 2</title>
  <desc id="desc">White product banner with Mobile Controller for Game Creator 2 text and a mobile directional control icon.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="5" stdDeviation="0" flood-color="#9a9a9a" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="900" height="600" fill="#ffffff"/>

  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif" fill="#050505">
    <text x="450" y="295" text-anchor="middle" font-size="72" font-weight="700">Mobile Controller</text>
    <text x="450" y="380" text-anchor="middle" font-size="54" font-weight="700">
      <tspan>for </tspan>
      <tspan fill="#3aa8e8">Game Creator 2</tspan>
    </text>
  </g>

  <g transform="translate(790 465)">
    <circle cx="0" cy="0" r="46" fill="#202124"/>
    <circle cx="0" cy="0" r="18" fill="#ffffff"/>
    <path d="M0 -33 L-7 -22 L7 -22 Z" fill="#ffffff"/>
    <path d="M33 0 L22 -7 L22 7 Z" fill="#ffffff"/>
    <path d="M0 33 L-7 22 L7 22 Z" fill="#ffffff"/>
    <path d="M-33 0 L-22 -7 L-22 7 Z" fill="#ffffff"/>
  </g>
</svg>
